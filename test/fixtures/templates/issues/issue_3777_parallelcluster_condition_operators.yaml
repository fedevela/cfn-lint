AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Focused AWS ParallelCluster issue 3777 reproduction preserving both
  StringEqualsIfExists occurrences and both reported set-qualified operators.
Resources:
  ParallelClusterClusterPolicyBatch:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: IamPassRole
            Effect: Allow
            Action: iam:PassRole
            Resource: "*"
            Condition:
              StringEqualsIfExists:
                iam:PassedToService:
                  - ecs-tasks.amazonaws.com
                  - batch.amazonaws.com
                  - codebuild.amazonaws.com
  ParallelClusterClusterPolicy1:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFormationCreateAndUpdate
            Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
            Resource: "*"
            Condition:
              ForAnyValue:StringEquals:
                aws:TagKeys:
                  - "parallelcluster:cluster-name"
  ParallelClusterClusterPolicy2:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: IamPassRole
            Effect: Allow
            Action: iam:PassRole
            Resource: "*"
            Condition:
              StringEqualsIfExists:
                iam:PassedToService:
                  - lambda.amazonaws.com
                  - ec2.amazonaws.com
                  - ec2.amazonaws.com.cn
                  - spotfleet.amazonaws.com
          - Sid: LoginNodesFunctionalities
            Effect: Allow
            Action:
              - autoscaling:DeleteAutoScalingGroup
              - elasticloadbalancing:ModifyLoadBalancerAttributes
            Resource: "*"
            Condition:
              ForAllValues:StringEquals:
                aws:TagKeys:
                  - "parallelcluster:cluster-name"
