AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::LanguageExtensions
Mappings:
  AccountMap:
    12345678901:
      Emails:
        - test@test.com
Resources:
  Topic:
    Type: AWS::SNS::Topic
  Fn::ForEach::Subscriptions:
    - Email
    - Fn::FindInMap:
        - AccountMap
        - Ref: AWS::AccountId
        - Emails
    - SubscriptionFor&{Email}:
        Type: AWS::SNS::Subscription
        Properties:
          Endpoint:
            Ref: Email
          Protocol: email
          TopicArn:
            Ref: Topic
