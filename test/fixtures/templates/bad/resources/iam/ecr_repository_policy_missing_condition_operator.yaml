---
AWSTemplateFormatVersion: "2010-09-09"
Resources:
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: ecr:GetDownloadUrlForLayer
            Condition:
              servicecatalog:accountLevel: self
