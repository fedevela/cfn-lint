---
AWSTemplateFormatVersion: "2010-09-09"
Resources:
  IAMPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: servicecatalog:List*
            Resource: "*"
            Condition:
              servicecatalog:accountLevel: self
